<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - موقع الشيخ أبوإبراهيم عبد الله بن سيف البريهي</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #03140c 0%, #082918 50%, #03140c 100%);
      --card-bg: rgba(12, 45, 27, 0.85);
      --card-border: #1d5c38;
      --gold: #f3d078;
      --gold-glow: rgba(243, 208, 120, 0.3);
      --text-light: #f5f5f5;
      --danger: #e74c3c;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-light);
      margin: 0;
      padding: 20px 15px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-family: 'Amiri', serif;
      color: var(--gold);
      font-size: 28px;
      margin: 5px 0;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
    }

    .card-title {
      font-family: 'Amiri', serif;
      color: var(--gold);
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(243, 208, 120, 0.2);
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #ddd;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 8px var(--gold-glow);
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #f3d078, #cbb058);
      color: #03140c;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: all 0.3s;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .item-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 4px solid var(--gold);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .item-info {
      flex: 1;
    }

    .item-title {
      font-weight: bold;
      color: var(--gold);
      font-size: 16px;
    }

    .item-sub {
      font-size: 13px;
      color: #bbb;
      margin-top: 4px;
    }

    .btn-delete {
      width: auto;
      padding: 6px 14px;
      background: var(--danger);
      color: white;
      font-size: 13px;
      margin-top: 0;
    }

    .btn-delete:hover {
      background: #c0392b;
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      text-align: center;
    }
    .alert-success { background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; color: #2ecc71; }
    .alert-error { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: #e74c3c; }

    #loginSection {
      max-width: 450px;
      margin: 60px auto 0 auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- شاشة تسجيل الدخول بكلمة السر -->
    <div id="loginSection" class="card">
      <h2 class="card-title" style="text-align: center;">تسجيل الدخول للوحة التحكم 🔒</h2>
      <div id="loginError" class="alert alert-error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>كلمة السر:</label>
          <input type="password" id="passInput" required placeholder="أدخل كلمة السر هنا">
        </div>
        <button type="submit">دخول 🔑</button>
      </form>
    </div>

    <!-- المحتوى الرئيسي للمدير (مخفي افتراضياً) -->
    <div id="adminContent" style="display: none;">
      <div class="header">
        <h1>لوحة تحكم المحتوى ⚙️</h1>
        <p>إدارة وإضافة الصوتيات، المقالات، الفتاوى والكتب</p>
      </div>

      <div class="card">
        <h2 class="card-title">إضافة عنصر جديد</h2>
        
        <div id="alertMsg" class="alert"></div>

        <form id="addForm">
          <div class="form-group">
            <label>اختر القسم:</label>
            <select id="categorySelect" onchange="toggleFields()">
              <option value="audios">🎙️ الصوتيات والمحاضرات</option>
              <option value="articles">📝 المقالات والبحوث</option>
              <option value="fatwas">💡 الفتاوى والأحكام</option>
              <option value="books">📚 الكتب والرسائل</option>
            </select>
          </div>

          <div class="form-group">
            <label id="titleLabel">عنوان الصوتية:</label>
            <input type="text" id="itemTitle" required placeholder="أدخل العنوان هنا">
          </div>

          <div class="form-group" id="speakerGroup">
            <label id="speakerLabel">الشيخ / القارئ:</label>
            <input type="text" id="itemSpeaker" placeholder="مثال: الشيخ عبد الله البريهي">
          </div>

          <div class="form-group" id="urlGroup">
            <label id="urlLabel">رابط الصوت المباشر (مثل Catbox):</label>
            <input type="url" id="itemUrl" placeholder="https://files.catbox.moe/...">
          </div>

          <div class="form-group" id="contentGroup" style="display: none;">
            <label id="contentLabel">نص المقال / الإجابة:</label>
            <textarea id="itemContent" rows="5" placeholder="أدخل النص هنا..."></textarea>
          </div>

          <button type="submit" id="submitBtn">➕ إضافة المحتوى</button>
        </form>
      </div>

      <div class="card">
        <h2 class="card-title">المحتويات المرفوعة (حسب القسم)</h2>
        
        <div class="form-group">
          <label>عرض المحتويات لـ:</label>
          <select id="viewCategorySelect" onchange="loadItems()">
            <option value="audios">🎙️ الصوتيات والمحاضرات</option>
            <option value="articles">📝 المقالات والبحوث</option>
            <option value="fatwas">💡 الفتاوى والأحكام</option>
            <option value="books">📚 الكتب والرسائل</option>
          </select>
        </div>

        <div id="itemsList">
          <p style="text-align: center; color: #aaa;">جاري تحميل العناصر...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // يمكنك تغيير كلمة السر للوحة التحكم من السطر التالي:
    const SECRET_PASSWORD = "123456";

    // إعدادات Firebase الخاص بموقعك
    const firebaseConfig = {
      apiKey: "AIzaSyDn7J5z-zN1QYK1T9iKVJ0BSQhNR866Pes",
      authDomain: "islamic-site-5c2a0.firebaseapp.com",
      projectId: "islamic-site-5c2a0",
      storageBucket: "islamic-site-5c2a0.firebasestorage.app",
      messagingSenderId: "971326278",
      appId: "1:971326278:web:73e6b18cf7962f0a280147"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // التحقق من كلمة السر عند الدخول
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const inputPass = document.getElementById('passInput').value;
      const errorDiv = document.getElementById('loginError');

      if (inputPass === SECRET_PASSWORD) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        toggleFields();
        loadItems();
      } else {
        errorDiv.innerText = 'كلمة السر غير صحيحة!';
        errorDiv.style.display = 'block';
      }
    });

    window.toggleFields = function() {
      const cat = document.getElementById('categorySelect').value;
      const speakerGroup = document.getElementById('speakerGroup');
      const urlGroup = document.getElementById('urlGroup');
      const contentGroup = document.getElementById('contentGroup');
      
      const titleLabel = document.getElementById('titleLabel');
      const speakerLabel = document.getElementById('speakerLabel');
      const urlLabel = document.getElementById('urlLabel');

      speakerGroup.style.display = 'block';
      urlGroup.style.display = 'block';
      contentGroup.style.display = 'none';

      if (cat === 'audios') {
        titleLabel.innerText = 'عنوان الصوتية:';
        speakerLabel.innerText = 'الشيخ / القارئ:';
        urlLabel.innerText = 'رابط الصوت المباشر (مثل Catbox):';
      } else if (cat === 'articles') {
        titleLabel.innerText = 'عنوان المقال:';
        speakerGroup.style.display = 'none';
        urlGroup.style.display = 'none';
        contentGroup.style.display = 'block';
      } else if (cat === 'fatwas') {
        titleLabel.innerText = 'السؤال / الفتوى:';
        speakerLabel.innerText = 'اسم الشيخ / المفتي:';
        urlGroup.style.display = 'none';
        contentGroup.style.display = 'block';
        document.getElementById('contentLabel').innerText = 'الإجابة:';
      } else if (cat === 'books') {
        titleLabel.innerText = 'عنوان الكتاب / الرسالة:';
        speakerLabel.innerText = 'المؤلف:';
        urlLabel.innerText = 'رابط تحميل ملف الكتاب (PDF):';
      }
    };

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'جاري الحفظ...';

      const cat = document.getElementById('categorySelect').value;
      const title = document.getElementById('itemTitle').value;
      const speaker = document.getElementById('itemSpeaker').value;
      const url = document.getElementById('itemUrl').value;
      const content = document.getElementById('itemContent').value;

      try {
        let data = {
          title: title,
          createdAt: serverTimestamp()
        };

        if (cat === 'audios') {
          data.speaker = speaker || 'الشيخ أبوإبراهيم عبد الله البريهي';
          data.audioUrl = url;
        } else if (cat === 'articles') {
          data.content = content;
        } else if (cat === 'fatwas') {
          data.question = title;
          data.answer = content;
          data.scholar = speaker || 'الشيخ أبوإبراهيم عبد الله البريهي';
        } else if (cat === 'books') {
          data.author = speaker || 'الشيخ عبد الله البريهي';
          data.fileUrl = url;
        }

        await addDoc(collection(db, cat), data);
        
        showAlert('تمت الإضافة بنجاح! 🎉', 'success');
        document.getElementById('addForm').reset();
        toggleFields();
        
        if (document.getElementById('viewCategorySelect').value === cat) {
          loadItems();
        }
      } catch (err) {
        console.error(err);
        showAlert('حدث خطأ أثناء الإضافة: ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '➕ إضافة المحتوى';
      }
    });

    window.loadItems = async function() {
      const cat = document.getElementById('viewCategorySelect').value;
      const listDiv = document.getElementById('itemsList');
      listDiv.innerHTML = '<p style="text-align: center; color: #aaa;">جاري التحميل...</p>';

      try {
        const q = query(collection(db, cat), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);

        if (snap.empty) {
          listDiv.innerHTML = '<p style="text-align: center; color: #aaa;">لا توجد عناصر مرفوعة في هذا القسم حالياً.</p>';
          return;
        }

        let html = '';
        snap.forEach((docSnap) => {
          const item = docSnap.data();
          const docId = docSnap.id;

          let displayTitle = item.title || item.question || 'بدون عنوان';
          let displaySub = item.speaker || item.author || item.scholar || '';

          html += `
            <div class="item-card">
              <div class="item-info">
                <div class="item-title">${displayTitle}</div>
                ${displaySub ? `<div class="item-sub">${displaySub}</div>` : ''}
              </div>
              <button class="btn-delete" onclick="deleteItem('${cat}', '${docId}')">حذف 🗑️</button>
            </div>
          `;
        });

        listDiv.innerHTML = html;
      } catch (err) {
        console.error(err);
        listDiv.innerHTML = '<p style="text-align: center; color: var(--danger);">حدث خطأ أثناء جلب البيانات.</p>';
      }
    };

    window.deleteItem = async function(cat, id) {
      if (!confirm('هل أنت تأكد من رغبتك في حذف هذا العنصر؟')) return;

      try {
        await deleteDoc(doc(db, cat, id));
        showAlert('تم الحذف بنجاح! 🗑️', 'success');
        loadItems();
      } catch (err) {
        console.error(err);
        showAlert('حدث خطأ أثناء الحذف.', 'error');
      }
    };

    function showAlert(msg, type) {
      const alertDiv = document.getElementById('alertMsg');
      alertDiv.innerText = msg;
      alertDiv.className = 'alert alert-' + type;
      alertDiv.style.display = 'block';
      setTimeout(() => {
        alertDiv.style.display = 'none';
      }, 3000);
    }
  </script>
</body>
</html>
