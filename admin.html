<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - موقع الشيخ عبدالله البريهي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #03140c; color: #fff; padding: 20px; text-align: center; }
        .login-box, .admin-panel { max-width: 500px; margin: 30px auto; background: #082918; border: 1px solid #1d5c38; padding: 25px; border-radius: 15px; text-align: right; }
        h2 { color: #f3d078; text-align: center; margin-top: 0; }
        label { font-weight: bold; color: #f3d078; display: block; margin-top: 15px; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1d5c38; background: #03140c; color: #fff; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        button { width: 100%; background: #f3d078; color: #03140c; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; font-size: 16px; }
        button:hover { background: #e0be67; }
        .msg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-box" id="loginBox">
    <h2>🔒 دخول لوحة التحكم</h2>
    <label>كلمة المرور:</label>
    <input type="password" id="passInput" placeholder="أدخل كلمة المرور (123)">
    <button onclick="login()">دخول اللوحة</button>
    <div class="msg" id="loginMsg"></div>
</div>

<div class="admin-panel" id="adminPanel" style="display: none;">
    <h2>🚀 إضافة محتوى جديد</h2>
    
    <label>اختر القسم:</label>
    <select id="sectionSelect" onchange="toggleFields()">
        <option value="audios">🎧 صوتيات ومحاضرات</option>
        <option value="articles">📝 مقال أو بحث</option>
        <option value="fatwas">💡 فتوى أو سؤال</option>
        <option value="books">📚 كتاب أو رسالة (PDF)</option>
    </select>

    <div id="fieldsContainer"></div>

    <button onclick="publishContent()">🚀 نشر المحتوى فوراً</button>
    <div class="msg" id="pubMsg"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyDn7J5z-zN1QYK1T9iKVJ0BSQhNR866Pes",
      authDomain: "islamic-site-5c2a0.firebaseapp.com",
      projectId: "islamic-site-5c2a0",
      storageBucket: "islamic-site-5c2a0.firebasestorage.app",
      messagingSenderId: "971326278",
      appId: "1:971326278:web:73e6b18cf7962f0a280147"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
window.db = db; 
  // دالة تحويل رابط Google Drive لرابط تشغيل مباشر تلقائياً
  function convertDriveUrl(url) {
      if (!url) return '';
      if (url.includes('drive.google.com')) {
          const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
          if (match && match[1]) {
              return `https://drive.google.com/uc?export=download&id=${match[1]}`;
          }
      }
      return url;
  }

  window.login = function() {
      const pass = document.getElementById('passInput').value;
      if(pass === '123') {
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          toggleFields();
      } else {
          document.getElementById('loginMsg').style.color = '#ff6b6b';
          document.getElementById('loginMsg').innerText = 'كلمة المرور غير صحيحة!';
      }
  };

  window.toggleFields = function() {
      const type = document.getElementById('sectionSelect').value;
      const container = document.getElementById('fieldsContainer');

      if(type === 'audios') {
          container.innerHTML = `
              <label>عنوان المحاضرة أو الصوتية:</label>
              <input type="text" id="title" placeholder="مثال: شرح كتاب التوحيد - الدرس الأول">
              <label>اسم الشيخ / القارئ:</label>
              <input type="text" id="speaker" value="الشيخ عبدالله بن سيف البريهي">
              <label>رابط Google Drive للملف الصوتي:</label>
              <input type="text" id="audioUrl" placeholder="الصق رابط مشاركة Google Drive هنا">
          `;
      } else if(type === 'articles') {
          container.innerHTML = `
              <label>عنوان المقال:</label>
              <input type="text" id="title" placeholder="عنوان المقال">
              <label>نص المقال:</label>
              <textarea id="content" rows="6" placeholder="اكتب نص المقال هنا..."></textarea>
          `;
      } else if(type === 'fatwas') {
          container.innerHTML = `
              <label>السؤال:</label>
              <input type="text" id="question" placeholder="نص السؤال">
              <label>الإجابة:</label>
              <textarea id="answer" rows="5" placeholder="نص الإجابة..."></textarea>
              <label>اسم الشيخ:</label>
              <input type="text" id="scholar" value="الشيخ عبدالله بن سيف البريهي">
          `;
      } else if(type === 'books') {
          container.innerHTML = `
              <label>عنوان الكتاب:</label>
              <input type="text" id="title" placeholder="اسم الكتاب أو الرسالة">
              <label>اسم المؤلف:</label>
              <input type="text" id="author" value="الشيخ عبدالله بن سيف البريهي">
              <label>رابط Google Drive لملف (PDF):</label>
              <input type="text" id="fileUrl" placeholder="الصق رابط مشاركة Google Drive هنا">
          `;
      }
  };

  window.publishContent = async function() {
      const type = document.getElementById('sectionSelect').value;
      const msg = document.getElementById('pubMsg');
      msg.style.color = '#f3d078';
      msg.innerText = '⏳ جاري النشر...';

      try {
          let data = { createdAt: serverTimestamp() };

          if(type === 'audios') {
              data.title = document.getElementById('title').value;
              data.speaker = document.getElementById('speaker').value;
              data.audioUrl = convertDriveUrl(document.getElementById('audioUrl').value);
          } else if(type === 'articles') {
              data.title = document.getElementById('title').value;
              data.content = document.getElementById('content').value;
          } else if(type === 'fatwas') {
              data.question = document.getElementById('question').value;
              data.answer = document.getElementById('answer').value;
              data.scholar = document.getElementById('scholar').value;
          } else if(type === 'books') {
              data.title = document.getElementById('title').value;
              data.author = document.getElementById('author').value;
              data.fileUrl = convertDriveUrl(document.getElementById('fileUrl').value);
          }

          await addDoc(collection(db, type), data);
          msg.style.color = '#2ecc71';
          msg.innerText = '✅ تم النشر بنجاح وظهرت في الموقع فوراً!';
          toggleFields();
      } catch(e) {
          console.error(e);
          msg.style.color = '#ff6b6b';
          msg.innerText = 'حدث خطأ أثناء النشر!';
      }
  };
</script>
<!-- قسم عرض المحتوى المرفوع وحذفه -->
<div style="margin: 40px auto; max-width: 500px; padding: 20px; background: #03140c; border-radius: 15px; color: #fff; text-align: right; direction: rtl;">
  <h2 style="color: #f3d078; text-align: center;">إدارة المحتوى المرفوع 🗑️</h2>
  <div id="deleteItemsList" style="margin-top: 15px;">
    <p style="text-align: center; color: #ccc;">جاري تحميل المحتوى...</p>
  </div>
</div>
<script type="module">
  import { getDocs, deleteDoc, doc, collection } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

  async function loadItemsToDelete() {
    const listContainer = document.getElementById('deleteItemsList');
    if (!listContainer) return;

    listContainer.innerHTML = '<p style="text-align: center; color: #ffd700;">جاري جلب البيانات... ⏳</p>';

    // الانتظار القصير لحين التعرف على قاعدة البيانات العامة
    let db = window.db;
    for (let i = 0; i < 20 && !db; i++) {
      await new Promise(resolve => setTimeout(resolve, 250));
      db = window.db;
    }

    if (!db) {
      listContainer.innerHTML = '<p style="text-align: center; color: #ff6b6b;">تعذر الاتصال بقاعدة البيانات، يرجى التحديث.</p>';
      return;
    }

    const collections = [
      'audios', 'audio', 
      'articles', 'article', 
      'fatwas', 'fatwa', 
      'books', 'book', 
      'lessons', 'lesson', 
      'lectures', 'lecture'
    ];

    listContainer.innerHTML = '';
    let hasItems = false;

    for (const colName of collections) {
      try {
        const querySnapshot = await getDocs(collection(db, colName));
        querySnapshot.forEach((docSnap) => {
          hasItems = true;
          const data = docSnap.data();
          const title = data.title || data.question || data.name || data.lessonTitle || 'محتوى بدون عنوان';

          const itemDiv = document.createElement('div');
          itemDiv.style.cssText = 'display: flex; justify-content: space-between; align-items: center; background: #1d5c38; padding: 12px; margin-bottom: 10px; border-radius: 8px; color: white; border: 1px solid #2ecc71;';

          itemDiv.innerHTML = `
            <span style="font-size: 14px;">📂 <strong>[${colName}]</strong> ${title}</span>
            <button class="del-btn" style="background: #e74c3c; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">حذف 🗑</button>
          `;

          itemDiv.querySelector('.del-btn').onclick = async () => {
            if (confirm(`هل أنت متأكد من حذف: "${title}"؟`)) {
              await deleteDoc(doc(db, colName, docSnap.id));
              alert('تم الحذف بنجاح!');
              loadItemsToDelete();
            }
          };

          listContainer.appendChild(itemDiv);
        });
      } catch (err) {
        console.error(`خطأ في جلب المجموعة ${colName}:`, err);
      }
    }

    if (!hasItems) {
      listContainer.innerHTML = '<p style="text-align: center; color: #ccc;">لا يوجد محتوى حالياً في قاعدة البيانات.</p>';
    }
  }

  window.addEventListener('load', loadItemsToDelete);
</script>
</body>
</html>
