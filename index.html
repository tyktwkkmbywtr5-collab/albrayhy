<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشيخ عبدالله بن سيف البريهي</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #03140c 0%, #082918 50%, #03140c 100%);
            --card-bg: rgba(12, 45, 27, 0.7);
            --card-border: #1d5c38;
            --gold: #f3d078;
            --gold-glow: rgba(243, 208, 120, 0.4);
            --cyan-glow: rgba(46, 204, 113, 0.3);
            --text-light: #f5f5f5;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-light);
            margin: 0;
            padding: 20px 15px;
            text-align: center;
            min-height: 100vh;
        }

        .header { padding: 20px 0 15px 0; }
        .header-title {
            font-family: 'Amiri', serif;
            color: var(--gold);
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 0 15px var(--gold-glow);
        }
        .header-sub { color: #83b999; font-size: 14px; margin-top: 5px; }
        .ornament { color: var(--gold); font-size: 18px; margin: 10px 0; opacity: 0.8; }

        /* الأقسام */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 520px;
            margin: 20px auto 30px auto;
        }
        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 22px 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .category-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 25px var(--gold-glow);
        }
        .category-icon { font-size: 36px; margin-bottom: 8px; }
        .category-title { font-size: 18px; font-weight: 700; color: #ffffff; }

        /* منطقة العرض الرئيسية والفرعية */
        .content-section {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px;
            text-align: right;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            min-height: 200px;
        }
        .section-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(243, 208, 120, 0.2);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .section-title {
            font-family: 'Amiri', serif;
            color: var(--gold);
            font-size: 22px;
            margin: 0;
            text-shadow: 0 0 10px var(--gold-glow);
        }
        .btn-back {
            background: rgba(243, 208, 120, 0.15);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-back:hover {
            background: var(--gold);
            color: #03140c;
        }

        /* كروت عناصر المحتوى */
        .item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 4px solid var(--gold);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .item-card:hover {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .item-title { font-size: 17px; font-weight: 700; color: var(--gold); margin-bottom: 6px; }
        .item-sub { font-size: 13.5px; color: #92c5a7; margin-bottom: 10px; }
        .item-body { font-family: 'Amiri', serif; font-size: 17px; line-height: 1.8; color: #e0e0e0; }
        audio { width: 100%; margin-top: 10px; border-radius: 8px; }
        .btn-link {
            display: inline-block;
            background: linear-gradient(135deg, #f3d078, #cbb058);
            color: #03140c;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
        }

        .empty-msg { text-align: center; color: #888; padding: 30px 0; }
        .footer { margin-top: 40px; font-size: 13px; color: #5c856f; font-family: 'Amiri', serif; }
    </style>
</head>
<body>

<div class="header">
    <div class="ornament">❖ ﷽ ❖</div>
    <h1 class="header-title">موقع الشيخ عبدالله بن سيف البريهي</h1>
    <div class="header-sub">المنصة العلمية والدعوية الجامعة</div>
    <div class="ornament">◈ ✤ ◈</div>
</div>

<!-- الواجهة الرئيسية -->
<div id="homeView">
    <div class="categories-grid">
        <div class="category-card" onclick="openCategoryView('audios', '🎧 قسم الصوتيات والمحاضرات')">
            <div class="category-icon">🎧</div>
            <div class="category-title">الصوتيات</div>
        </div>
        <div class="category-card" onclick="openCategoryView('articles', '📝 قسم المقالات والبحوث')">
            <div class="category-icon">📝</div>
            <div class="category-title">المقالات</div>
        </div>
        <div class="category-card" onclick="openCategoryView('fatwas', '💡 قسم الفتاوى والأحكام')">
            <div class="category-icon">💡</div>
            <div class="category-title">الفتاوى</div>
        </div>
        <div class="category-card" onclick="openCategoryView('books', '📚 قسم الكتب والرسائل')">
            <div class="category-icon">📚</div>
            <div class="category-title">الكتب والرسائل</div>
        </div>
    </div>

    <!-- قسم أحدث الصوتيات على الصفحة الرئيسية -->
    <div class="content-section">
        <div class="section-header-bar">
            <h2 class="section-title">🎧 أحدث الصوتيات والمحاضرات</h2>
        </div>
        <div id="latestAudiosList">
            <div class="empty-msg">⏳ جاري تحميل أحدث الصوتيات...</div>
        </div>
    </div>
</div>

<!-- واجهة القسم عند الضغط عليه -->
<div id="sectionView" style="display: none;">
    <div class="content-section">
        <div class="section-header-bar">
            <h2 class="section-title" id="sectionTitle">عنوان القسم</h2>
            <button class="btn-back" onclick="showHomeView()">⬅ العودة للرئيسية</button>
        </div>
        <div id="categoryItemsList">
            <div class="empty-msg">⏳ جاري تحميل المحتوى...</div>
        </div>
    </div>
</div>

<div class="footer">
    جميع الحقوق محفوظة © موقع الشيخ عبدالله بن سيف البريهي 2026
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyDn7J5z-zN1QYK1T9iKVJ0BSQhNR866Pes",
      authDomain: "islamic-site-5c2a0.firebaseapp.com",
      projectId: "islamic-site-5c2a0",
      storageBucket: "islamic-site-5c2a0.firebasestorage.app",
      messagingSenderId: "971326278",
      appId: "1:971326278:web:73e6b18cf7962f0a280147"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 1. جلب أحدث صوتيتين فقط للصفحة الرئيسية
  async function loadLatestAudios() {
      const container = document.getElementById('latestAudiosList');
      try {
          const q = query(collection(db, 'audios'), orderBy('createdAt', 'desc'), limit(2));
          const snap = await getDocs(q);
          
          if(snap.empty) {
              container.innerHTML = '<div class="empty-msg">لا توجد صوتيات مرفوعة حالياً</div>';
              return;
          }
          
          let html = '';
          snap.forEach(doc => {
              const data = doc.data();
              html += `
                  <div class="item-card">
                      <div class="item-title">${data.title || 'بدون عنوان'}</div>
                      ${data.speaker ? `<div class="item-sub">الشيخ / القارئ: ${data.speaker}</div>` : ''}
                      ${data.audioUrl ? `<audio controls src="${data.audioUrl}"></audio>` : ''}
                  </div>`;
          });
          container.innerHTML = html;
      } catch(e) {
          console.error(e);
          container.innerHTML = '<div class="empty-msg">لم يتم إضافة صوتيات بعد</div>';
      }
  }

  // 2. فتح صفحة القسم المحددة
  window.openCategoryView = async function(type, title) {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('sectionView').style.display = 'block';
      document.getElementById('sectionTitle').innerText = title;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const listDiv = document.getElementById('categoryItemsList');
      listDiv.innerHTML = '<div class="empty-msg">⏳ جاري تحميل كافة محتويات القسم...</div>';

      try {
          const q = query(collection(db, type), orderBy('createdAt', 'desc'));
          const snap = await getDocs(q);
          
          if(snap.empty) {
              listDiv.innerHTML = '<div class="empty-msg">لا توجد عناصر مرفوعة في هذا القسم حالياً</div>';
              return;
          }
          
          let html = '';
          snap.forEach(doc => {
              const data = doc.data();
              if (type === 'audios') {
                  html += `
                      <div class="item-card">
                          <div class="item-title">${data.title || 'بدون عنوان'}</div>
                          ${data.speaker ? `<div class="item-sub">الشيخ / القارئ: ${data.speaker}</div>` : ''}
                          ${data.audioUrl ? `<audio controls src="${data.audioUrl}"></audio>` : ''}
                      </div>`;
              } else if (type === 'articles') {
                  html += `
                      <div class="item-card">
                          <div class="item-title">${data.title || 'بدون عنوان'}</div>
                          <div class="item-body">${data.content || ''}</div>
                      </div>`;
              } else if (type === 'fatwas') {
                  html += `
                      <div class="item-card">
                          <div class="item-title">السؤال: ${data.question || ''}</div>
                          <div class="item-body"><b>الإجابة:</b> ${data.answer || ''}</div>
                          ${data.scholar ? `<div class="item-sub">الشيخ: ${data.scholar}</div>` : ''}
                      </div>`;
              } else if (type === 'books') {
                  html += `
                      <div class="item-card">
                          <div class="item-title">${data.title || 'بدون عنوان'}</div>
                          ${data.author ? `<div class="item-sub">المؤلف: ${data.author}</div>` : ''}
                          ${data.fileUrl ? `<a href="${data.fileUrl}" target="_blank" class="btn-link">📥 تحميل الكتاب (PDF)</a>` : ''}
                      </div>`;
              }
          });
          listDiv.innerHTML = html;
      } catch(e) {
          console.error(e);
          listDiv.innerHTML = '<div class="empty-msg">حدث خطأ أثناء جلب البيانات</div>';
      }
  };

  // 3. العودة للصفحة الرئيسية
  window.showHomeView = function() {
      document.getElementById('sectionView').style.display = 'none';
      document.getElementById('homeView').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // تشغيل تحميل أحدث الصوتيات فور فتح الصفحة
  loadLatestAudios();
</script>

</body>
</html>
